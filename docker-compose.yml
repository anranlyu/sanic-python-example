services:
  web:
    build: .
    container_name: sanic_app
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=app
      - MYSQL_PASSWORD=app_password
      - MYSQL_DATABASE=test_db
    volumes:
      - .:/app
      - /app/__pycache__
    depends_on:
      - db
    networks:
      - app_network

  db:
    image: mysql:8.0
    container_name: mysql_db
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: test_db
      # Best practice: create a dedicated non-root user for the application.
      # This user will be granted privileges on MYSQL_DATABASE.
      MYSQL_USER: app
      MYSQL_PASSWORD: app_password
    ports:
      - "3320:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  mysql_data: